---
# Same Namespace as deploy/namespace.yaml - db.yml usually runs first, so it is
# repeated here (apply is idempotent) to guarantee the node-selector annotation
# is set before the CNPG pod is scheduled.
apiVersion: v1
kind: Namespace
metadata:
  name: start-hack
  annotations:
    scheduler.alpha.kubernetes.io/node-selector: homelab.sthomas.ch/location=strato
