---
# CNPG Postgres + PostGIS for start-hack. One Cluster.
# CNPG creates Secret `start-hack-db-app`
# (username/password/dbname/host/port/uri/jdbc-uri). Applied by
# homelab-actions/cnpg-cluster (../.github/workflows/db.yml), separate from the
# app deploy. Legacy DB (tiny, 2 tables) is replayed once - see the repo README.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: start-hack-db
spec:
  instances: 1
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-minimal-trixie
    major: 18
  postgresql:
    extensions:
      - name: postgis
  storage:
    size: 2Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: start_hack
      owner: start_hack
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS postgis
        - CREATE EXTENSION IF NOT EXISTS fuzzystrmatch
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 512Mi }
