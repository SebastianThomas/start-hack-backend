---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: start-hack-ws
  labels: { app: start-hack-ws }
spec:
  replicas: 1
  strategy: { type: Recreate }   # RWO PVC - only one pod at a time
  selector:
    matchLabels: { app: start-hack-ws }
  template:
    metadata:
      labels: { app: start-hack-ws }
    spec:
      volumes:
        - name: config
          configMap: { name: start-hack-ws-config }
        - name: data
          persistentVolumeClaim: { claimName: start-hack-data }
        - name: public
          emptyDir: { sizeLimit: 1Gi }
      containers:
        - name: ws
          image: ${WS_IMAGE}
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            # jib sets SPRING_CONFIG_LOCATION=/config/ -> loads
            # /config/application.properties (+ -prod for the prod profile).
            - { name: config, mountPath: /config, readOnly: true }
            # /data is the input reference set - the app only reads it, but the
            # mount stays writable so it can be seeded via `kubectl exec ... tar`.
            - { name: data, mountPath: /data }
            - { name: public, mountPath: /public }
          env:
            # Sized from measurement, not percentages. With a 1536Mi limit the JVM
            # sat at 1.4Gi RSS while idle: a %-based max heap resolved to 1076MB,
            # and because a limit under 1792MB puts ergonomics below the
            # "server-class" threshold it picked SerialGC, which only collects when
            # the heap is full and never uncommits. A forced full GC showed just
            # ~102MB live (+120MB metaspace) - the other ~1.2Gi was headroom the
            # JVM had taken and had no reason to give back.
            #
            # So: pin -Xmx instead of a percentage (an explicit -Xmx also
            # overrides the image entrypoint's MaxRAMPercentage=80), ask for G1
            # explicitly rather than hoping ergonomics picks it, and let its
            # periodic concurrent cycle uncommit while idle. 640m is ~6x the live
            # set and still above the 426MB the old heap held pre-GC, so the
            # startup GDAL jobs keep plenty of room.
            - { name: ADDITIONAL_JAVA_OPTS, value: "-Xms128m -Xmx640m -XX:MaxMetaspaceSize=192m -XX:+UseG1GC -XX:G1PeriodicGCInterval=120000 -XX:+G1PeriodicGCInvokesConcurrent" }
            - { name: SPRING_DATASOURCE_URL,      valueFrom: { secretKeyRef: { name: start-hack-db-app, key: jdbc-uri } } }
            - { name: SPRING_DATASOURCE_USERNAME, valueFrom: { secretKeyRef: { name: start-hack-db-app, key: username } } }
            - { name: SPRING_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: start-hack-db-app, key: password } } }
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 60          # Flyway + JVM + GDAL init
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
          resources:
            # Measured on the rollout of the flags above, not estimated:
            #   startup peak (VmHWM)  997MB
            #   steady state          ~620MB RSS / ~720Mi working set
            #   heap committed        ~264MB against the 640m max (G1 uncommits)
            #
            # The startup peak is what sets the floor for the limit, NOT the
            # steady state: the GDAL raster jobs really do allocate ~1Gi for a
            # few seconds. Do not size this off the idle number - dropping the
            # limit to ~768Mi would OOMKill the pod during startup. 1280Mi keeps
            # ~280MB over the observed peak.
            #
            # (An earlier revision of this comment blamed the old 1445MB VmHWM
            # entirely on un-uncommitted SerialGC heap. That was wrong: the old
            # heap was simply sitting above the GDAL spike, hiding it.)
            requests: { cpu: 150m, memory: 448Mi }
            limits: { memory: 1280Mi }
