name: db
run-name: "provision DB @ ${{ inputs.tag }}"

# Provisions/reconciles the CNPG Postgres+PostGIS Cluster. On demand,
# repeatable, never a side effect of an app release. The legacy DB (2 tables)
# is replayed once from a dump - see deploy/README.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag/ref to read the db/ manifests from (e.g. v1.2.3)
        required: true
        type: string

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: SebastianThomas/homelab-actions/headscale-connect@v1
        with:
          auth-key: ${{ secrets.TS_AUTHKEY }}
          login-server: ${{ secrets.HEADSCALE_URL }}
          ping: kube-cp-01

      - uses: SebastianThomas/homelab-actions/cnpg-cluster@v1
        with:
          server: ${{ secrets.KUBE_API }}
          ca: ${{ secrets.KUBE_CA }}
          token: ${{ secrets.KUBE_TOKEN }}
          namespace: start-hack
          manifests: db
          timeout: 900s
