name: Pull request build

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Maven verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: maven
          cache-dependency-path: start-hack-backend/**/pom.xml

      - name: Build and test
        run: mvn --batch-mode --update-snapshots clean verify -f start-hack-backend/pom.xml
