name: Build with maven and Push to Docker Registry
on:
    push:
        tags:
            - v*
    workflow_dispatch:
        inputs:
            ref_name:
                required: true
                type: string
                description: Tag to build (and, if it is a tag, deploy)

jobs:
    create-docker-image:
        name: Create Docker Image
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
                with:
                    ref: ${{ inputs.ref_name || github.ref_name }}

            -   name: Git Status
                run: git status

            -   name: Set up JDK
                uses: actions/setup-java@v4
                with:
                    java-version: 21
                    distribution: 'temurin'

            -   name: Create maven central settings.xml
                uses: whelk-io/maven-settings-xml-action@9dc09b23833fa9aa7f27b63db287951856f3433d

            -   name: Set TAG_NAME from ref_name
                run: echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

            -   name: Replace all characters in `\/:"<>|?*` by `-` in TAG_NAME
                run: echo "TAG_NAME=$(echo "$TAG_NAME" | sed 's/[\/:"<>|?*]/-/g')" >> $GITHUB_ENV

            -   name: Set maven root directory
                run: echo "MVN_ROOT_DIR=start-hack-backend" >> $GITHUB_ENV

            -   name: Set VERSION from TAG_NAME
                run: echo "VERSION=${TAG_NAME}" >> $GITHUB_ENV

            -   name: Strip leading `v` from VERSION
                run: echo "VERSION=${VERSION##v}" >> $GITHUB_ENV

            -   name: Set versions
                run: mvn -f ${{ env.MVN_ROOT_DIR }}/pom.xml versions:set -DnewVersion=$VERSION

            -   name: Commit versions
                run: mvn -f ${{ env.MVN_ROOT_DIR }}/pom.xml versions:commit

            -   name: Build with Maven
                run: mvn --batch-mode --update-snapshots install -DskipTests -f ${{ env.MVN_ROOT_DIR }}/pom.xml

            -   name: Set default docker image
                run: |
                    echo "DOCKER_IMAGE=sthomasch/eclipse-temurin-gdal:21" >> $GITHUB_ENV

            -   name: Docker image for build
                run: |
                    echo "Docker image jar build: $DOCKER_IMAGE"

            -   name: Login to DockerHub
                uses: docker/login-action@v2
                with:
                    username: ${{ secrets.docker_hub_username }}
                    password: ${{ secrets.docker_hub_password }}

            # The entrypoint's JVM flags are only a default for running the image
            # bare (compose.yaml). They come BEFORE $ADDITIONAL_JAVA_OPTS so the
            # K3s deployment can override them - deploy/deployment.yaml pins an
            # explicit -Xmx, which wins over any RAMPercentage flag.
            #
            # There used to be a -XX:MinRAMPercentage=60.0 here. It did nothing:
            # MinRAMPercentage only caps the heap when total RAM is under ~256MB,
            # it does not set the initial heap (that is InitialRAMPercentage). It
            # cost real time during a memory investigation, so it is gone.
            # MaxRAMPercentage is 60 rather than 80 because this app also does
            # GDAL raster work in native memory, on top of the heap.
            #
            # UseG1GC is explicit because ergonomics only defaults to G1 on a
            # "server-class" machine (>=2 CPUs AND >=1792MB). Under any smaller
            # memory limit it silently falls back to SerialGC, which collects
            # only when the heap is full and never uncommits - that is exactly
            # how the ws pod ended up holding 1.5Gi for a ~250MB working set.
            # Forcing G1 keeps a bare `docker run` / compose run out of that trap.
            -   name: Build and push docker image
                run: |
                    mvn --batch-mode package jib:build \
                    -f start-hack-backend/start-hack-ws/pom.xml \
                    -Dconfig.deploy.env=dev -Dconfig.directory=/config \
                    -Dimage=${{ secrets.docker_hub_username }}/start-hack-backend:${{ env.VERSION }} \
                    -Djib.from.image=${{ env.DOCKER_IMAGE }} \
                    -Djib.to.tags=latest,${{ env.VERSION }} \
                    -Djib.to.auth.username=${{ secrets.docker_hub_username }} \
                    -Djib.to.auth.password=${{ secrets.docker_hub_password }} \
                    -Djib.container.volumes='/config/' \
                    -Djib.container.environment=VERSION_TAG_NAME="${{ env.TAG_NAME }}",SPRING_CONFIG_LOCATION="/config/",SPRING_DOCKER_COMPOSE_ENABLED=false \
                    -Djib.container.entrypoint='sh,-c,java -XX:MaxRAMPercentage=60.0 -XX:+UseG1GC $ADDITIONAL_JAVA_OPTS -cp @/app/jib-classpath-file @/app/jib-main-class-file $@'

    # Roll the freshly-pushed image out to K3s. Only when the build ref is a v*
    # tag - a plain branch build just publishes the image. deploy.yml also runs
    # standalone ("Run workflow") to redeploy any already-built tag.
    deploy:
        needs: create-docker-image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/workflows/deploy.yml
        with:
            tag: ${{ github.ref_name }}
        secrets: inherit
