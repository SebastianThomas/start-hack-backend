name: deploy
run-name: "deploy @ ${{ inputs.tag }}"

# Deploy the start-hack backend to K3s (namespace start-hack).
#   - called by "Build with maven and Push to Docker Registry" right after it
#     pushes the image for a v* tag  (jobs.deploy `uses:` this file)
#   - or run manually ("Run workflow") against any already-built tag
# For a brand-new cluster run db.yml first, then replay/seed - see deploy/README.md.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to deploy (image must already be built, e.g. v1.2.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to deploy (image must already be built, e.g. v1.2.3)
        required: true
        type: string

concurrency:
  group: deploy-start-hack
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - id: img
        env:
          TAG: ${{ inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"   # image tag = version, no leading v

      - uses: SebastianThomas/homelab-actions/headscale-connect@v1
        with:
          auth-key: ${{ secrets.TS_AUTHKEY }}
          login-server: ${{ secrets.HEADSCALE_URL }}
          ping: kube-cp-01

      - uses: SebastianThomas/homelab-actions/kube-deploy@v1
        with:
          server: ${{ secrets.KUBE_API }}
          ca: ${{ secrets.KUBE_CA }}
          token: ${{ secrets.KUBE_TOKEN }}
          namespace: start-hack
          manifests: deploy
          images: |
            WS_IMAGE=${{ secrets.docker_hub_username }}/start-hack-backend:${{ steps.img.outputs.version }}
          rollout: deployment/start-hack-ws
          rollout-timeout: 420s
